[project]
name = "inflation-forecasts-vs-reality"
version = "0.1.0"
description = "Build-time data pipeline: Banco Central's Focus survey forecasts vs. what actually happened"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "polars>=1.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
